name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tag is v0.10.2; everything downstream (image tag, app version,
      # acapulko-ha version:) uses the bare SemVer 0.10.2 so all four
      # places hold one byte-identical string.
      - name: Resolve bare SemVer
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build for Raspberry Pi 5 (linux/arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -trimpath \
            -o acapulko-linux-arm64 \
            ./src/cmd/server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: acapulko-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      # Pure-app repo never builds HA artifacts; it only tells the HA glue
      # repo "a new version exists". acapulko-ha's bump.yml does the rest.
      - name: Notify acapulko-ha of new release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CI_DISPATCH_TOKEN }}
          repository: alex-popov-tech/acapulko-ha
          event-type: acapulko-release
          client-payload: '{"version": "${{ steps.ver.outputs.version }}"}'
